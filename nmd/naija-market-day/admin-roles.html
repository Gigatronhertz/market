<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roles and permissions · Naija Market Day admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--accent:#0F6B4A;--ink:#111816;--muted:#5F6B66;--line:#E6EAE8}
*{box-sizing:border-box}
body{margin:0;background:#F6F8F7;color:var(--ink);font-family:Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:0 0 240px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:2px}
.side a{padding:10px 12px;font-size:15px;border-radius:10px}
.side a.on{background:#EEF4F0;color:var(--accent);font-weight:600}
.main{flex:999 1 600px;min-width:0;padding:32px;display:flex;flex-direction:column;gap:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;text-align:center}
th:first-child,td:first-child{text-align:left}
td{padding:14px 12px;border-bottom:1px solid #EEF1EF;text-align:center}
td:first-child{font-weight:500}
.chip{padding:3px 12px;font-size:13px;font-weight:600;border-radius:999px;white-space:nowrap}
.ok{background:#E1F1E8;color:#145A3A}.wait{background:#FBEBCB;color:#7A4A0A}
.sw{width:44px;height:26px;border-radius:999px;border:0;padding:3px;cursor:pointer;display:inline-flex;align-items:center}
.knob{width:20px;height:20px;border-radius:50%;background:#fff;display:block}
.btn{border-radius:999px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;background:var(--accent);color:#fff;border:1px solid var(--accent)}
</style>
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-nmd="admin-roles" data-gate="admin">
<div class="shell">
  <nav class="side" aria-label="Admin sections">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:24px;padding:0 8px"><span style="width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center">N</span>NMD</a>
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-approvals.html">Approvals</a>
    <a href="admin-maps.html">Booth map</a>
    <a href="admin-payments.html">Payments</a>
    <a href="admin-emails.html">Vendor emails</a>
    <a href="admin-ads.html">Ads</a>
    <a href="admin-content.html">News and events</a>
    <a href="admin-chats.html">Chats and support</a>
    <a href="admin-roles.html" class="on">Roles and permissions</a>
    <div style="margin-top:auto;padding-top:24px;border-top:1px solid var(--line)"><a href="logged-out.html" style="color:#8A2A1C">Log out</a></div>
  </nav>
  <main class="main">
    <header style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px">
      <div><h1 style="margin:0;font-size:30px;letter-spacing:-.02em">Roles and permissions</h1><p style="margin:4px 0 0;color:var(--muted);font-size:15px">Decide who on the NMD team can do what.</p></div>
      <button class="btn" id="invite" type="button">Invite teammate</button>
    </header>

    <section class="card">
      <h2 style="margin:0 0 8px;font-size:18px;text-align:left">Permissions by role</h2>
      <table>
        <thead><tr><th></th><th>Super admin</th><th>Operations</th><th>Content editor</th><th>Support</th></tr></thead>
        <tbody id="matrix"></tbody>
      </table>
    </section>

    <section class="card">
      <h2 style="margin:0 0 8px;font-size:18px">Team</h2>
      <table>
        <thead><tr><th style="text-align:left">Name</th><th style="text-align:left">Email</th><th style="text-align:left">Role</th><th style="text-align:left">Status</th><th style="text-align:left"></th></tr></thead>
        <tbody id="team-rows"></tbody>
      </table>
    </section>
  </main>
</div>
<script src="assets/nmd-wire.js"></script>
<script>
// Team: live accounts. Invite creates a staff or admin account and emails a set-password link.
(function () {
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var LABEL = { admin: 'Admin', staff: 'Check-in staff', vendor: 'Vendor', buyer: 'Buyer' };
  var CHIP = { active: '<span class="chip ok">Active</span>', invited: '<span class="chip wait">Invited</span>', suspended: '<span class="chip no">Suspended</span>', removed: '<span class="chip no">Removed</span>' };
  function load() {
    return nmd.api('/admin/users?role=admin').then(function (admins) {
      return nmd.api('/admin/users?role=staff').then(function (staff) {
        var team = admins.concat(staff.filter(function (s) { return !admins.some(function (a) { return a.id === s.id; }); }));
        document.getElementById('team-rows').innerHTML = team.length ? team.map(function (u) {
          var role = (u.roles || '').split(',').map(function (r) { return LABEL[r.trim()] || r; }).join(', ');
          return '<tr><td><b>' + esc(u.name || '(no name)') + '</b></td><td>' + esc(u.email) + '</td><td>' + esc(role) + '</td><td>' + (CHIP[u.status] || esc(u.status)) + '</td><td>' +
            '<button class="btn" style="padding:6px 12px" data-suspend="' + u.id + '" data-status="' + u.status + '">' + (u.status === 'suspended' ? 'Reactivate' : 'Suspend') + '</button></td></tr>';
        }).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:24px">No team members yet.</td></tr>';
      });
    }).catch(function (err) { nmdToast(err.message, true); });
  }
  document.addEventListener('DOMContentLoaded', function () {
    load();
    document.getElementById('invite').addEventListener('click', function () {
      var name = prompt('Their name?'); if (!name) return;
      var email = prompt('Their email address?'); if (!email) return;
      var role = prompt('Role: type admin or staff (check-in staff)', 'staff');
      nmd.api('/admin/users/invite', { method: 'POST', body: { name: name, email: email, role: role === 'admin' ? 'admin' : 'staff', market_ids: [] } })
        .then(function () { nmdToast('Invitation sent to ' + email); return load(); })
        .catch(function (err) { nmdToast(err.message, true); });
    });
    document.getElementById('team-rows').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-suspend]'); if (!b) return;
      var id = b.getAttribute('data-suspend');
      var action = b.getAttribute('data-status') === 'suspended' ? 'reactivate' : 'suspend';
      nmd.api('/admin/users/' + id + '/' + action, { method: 'POST', body: {} })
        .then(function () { nmdToast('Updated'); return load(); }).catch(function (err) { nmdToast(err.message, true); });
    });
  });
})();
</script>
</body>
<script src="assets/site.js" defer></script>
</body>
</html>
