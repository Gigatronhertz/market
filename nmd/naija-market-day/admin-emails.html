<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor emails · Naija Market Day admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--accent:#0F6B4A;--ink:#111816;--muted:#5F6B66;--line:#E6EAE8}
*{box-sizing:border-box}
body{margin:0;background:#F6F8F7;color:var(--ink);font-family:Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:0 0 240px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:2px}
.side a{padding:10px 12px;font-size:15px;border-radius:10px}
.side a.on{background:#EEF4F0;color:var(--accent);font-weight:600}
.main{flex:999 1 600px;min-width:0;padding:32px;display:flex;flex-direction:column;gap:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #EEF1EF;cursor:pointer}
.row:first-child{border-top:0}
.row.sel{background:#F6FAF7;margin:0 -24px;padding:14px 24px}
.sw{width:44px;height:26px;border-radius:999px;border:0;padding:3px;display:flex;align-items:center;flex:none;cursor:pointer}
.knob{width:20px;height:20px;border-radius:50%;background:#fff;display:block}
.btn{border-radius:999px;padding:11px 22px;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit;border:1px solid #D5DBD8;background:#fff}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-nmd="admin-emails" data-gate="admin">
<div class="shell">
  <nav class="side" aria-label="Admin sections">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:24px;padding:0 8px"><span style="width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center">N</span>NMD</a>
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-approvals.html">Approvals</a>
    <a href="admin-maps.html">Booth map</a>
    <a href="admin-payments.html">Payments</a>
    <a href="admin-emails.html" class="on">Vendor emails</a>
    <a href="admin-ads.html">Ads</a>
    <a href="admin-content.html">News and events</a>
    <a href="admin-chats.html">Chats and support</a>
    <a href="admin-roles.html">Roles and permissions</a>
    <div style="margin-top:auto;padding-top:24px;border-top:1px solid var(--line)"><a href="logged-out.html" style="color:#8A2A1C">Log out</a></div>
  </nav>
  <main class="main">
    <header><h1 style="margin:0;font-size:30px;letter-spacing:-.02em">Vendor emails</h1><p style="margin:4px 0 0;color:var(--muted);font-size:15px">Automatic emails vendors get at each step. Switch each one on or off.</p></header>
    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
      <section class="card" id="list" style="flex:1 1 420px"></section>
      <section class="card" style="flex:1 1 380px">
        <div style="font-size:13px;color:var(--muted)">Preview</div>
        <h2 id="pv-name" style="margin:4px 0 14px;font-size:20px"></h2>
        <div style="background:#F6F8F7;border-radius:14px;padding:20px;font-size:15px;line-height:1.6">
          <div style="font-size:13px;color:var(--muted);margin-bottom:8px" id="pv-subj"></div>
          <span id="pv-body" style="white-space:pre-wrap"></span>
        </div>
        <div style="display:flex;gap:10px;margin-top:16px"><button class="btn primary" id="test" type="button">Send test to me</button><button class="btn" id="edit" type="button">Edit template</button></div>
      </section>
    </div>
  </main>
</div>
<script src="assets/nmd-wire.js"></script>
<script>
// Vendor emails: every automatic message is a live template. Switch them on or off, preview, and send a test.
(function () {
  var current = null, rows = [];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var WHEN = { action: 'When it happens', before_market: 'Before the market', after_market: 'After the market', manual: 'Sent by hand' };
  function show(t) {
    current = t;
    document.getElementById('pv-name').textContent = t.name;
    nmd.api('/admin/messaging/templates/' + t.key + '/preview').then(function (p) {
      document.getElementById('pv-subj').textContent = 'Subject: ' + p.subject;
      document.getElementById('pv-body').textContent = p.body;
    }).catch(function (err) { nmdToast(err.message, true); });
  }
  function draw() {
    document.getElementById('list').innerHTML = '<h2 style="margin:0 0 8px;font-size:20px">Automatic emails</h2>' + rows.map(function (t) {
      return '<div style="display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:14px 0;border-top:1px solid #EEF1EF">' +
        '<button type="button" data-key="' + esc(t.key) + '" style="all:unset;cursor:pointer;flex:1;min-width:0"><div style="font-weight:600">' + esc(t.name) + '</div>' +
        '<div style="font-size:13px;color:var(--muted);margin-top:2px">' + esc(WHEN[t.trigger_type] || '') + (t.trigger_type === 'before_market' ? ' (' + t.offset_days + ' day)' : '') + ' · ' + esc(t.audience) + '</div></button>' +
        '<label style="display:flex;gap:6px;align-items:center;font-size:13px;white-space:nowrap"><input type="checkbox" data-toggle="' + esc(t.key) + '"' + (t.active ? ' checked' : '') + '> On</label></div>';
    }).join('');
  }
  function load() {
    return nmd.api('/admin/messaging/templates').then(function (r) {
      rows = r;
      draw();
      if (!current && rows.length) show(rows[0]);
    }).catch(function (err) { nmdToast(err.message, true); });
  }
  document.addEventListener('DOMContentLoaded', function () {
    load();
    document.getElementById('list').addEventListener('click', function (e) {
      var k = e.target.closest('button[data-key]');
      if (k) { var t = rows.filter(function (r) { return r.key === k.getAttribute('data-key'); })[0]; if (t) show(t); }
    });
    document.getElementById('list').addEventListener('change', function (e) {
      var c = e.target.closest('input[data-toggle]'); if (!c) return;
      nmd.api('/admin/messaging/templates/' + c.getAttribute('data-toggle'), { method: 'PUT', body: { active: c.checked } })
        .then(function () { nmdToast(c.checked ? 'Turned on' : 'Turned off'); load(); })
        .catch(function (err) { c.checked = !c.checked; nmdToast(err.message, true); });
    });
    document.getElementById('test').addEventListener('click', function () {
      if (!current) return;
      nmd.api('/admin/messaging/test', { method: 'POST', body: { key: current.key } })
        .then(function (r) { nmdToast('Test sent to ' + r.to); }).catch(function (err) { nmdToast(err.message, true); });
    });
    document.getElementById('edit').addEventListener('click', function () {
      if (!current) return;
      location.href = '/app/admin.html#/messaging/template/' + current.key;
    });
  });
})();
</script>
</body>
<script src="assets/site.js" defer></script>
</body>
</html>
