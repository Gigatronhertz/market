<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chats and support · Naija Market Day admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--accent:#0F6B4A;--ink:#111816;--muted:#5F6B66;--line:#E6EAE8}
*{box-sizing:border-box}
body{margin:0;background:#F6F8F7;color:var(--ink);font-family:Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:0 0 240px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:2px}
.side a{padding:10px 12px;font-size:15px;border-radius:10px}
.side a.on{background:#EEF4F0;color:var(--accent);font-weight:600}
.main{flex:999 1 600px;min-width:0;padding:32px;display:flex;flex-direction:column;gap:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;flex:1 1 420px;min-width:0}
.chip{padding:3px 12px;font-size:13px;font-weight:600;border-radius:999px}
.open{background:#FBEBCB;color:#7A4A0A}.done{background:#E1F1E8;color:#145A3A}.bad{background:#FADDD8;color:#8A2A1C}
.btn{border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;border:1px solid #D5DBD8;background:#fff}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:#8A2A1C;border-color:#E3B4AC}
</style>
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-nmd="admin-chats" data-gate="admin">
<div class="shell">
  <nav class="side" aria-label="Admin sections">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:24px;padding:0 8px"><span style="width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center">N</span>NMD</a>
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-approvals.html">Approvals</a>
    <a href="admin-maps.html">Booth map</a>
    <a href="admin-payments.html">Payments</a>
    <a href="admin-emails.html">Vendor emails</a>
    <a href="admin-ads.html">Ads</a>
    <a href="admin-content.html">News and events</a>
    <a href="admin-chats.html" class="on">Chats and support</a>
    <a href="admin-roles.html">Roles and permissions</a>
    <div style="margin-top:auto;padding-top:24px;border-top:1px solid var(--line)"><a href="logged-out.html" style="color:#8A2A1C">Log out</a></div>
  </nav>
  <main class="main">
    <header>
      <h1 style="margin:0;font-size:30px;letter-spacing:-.02em">Chats and support</h1>
      <p style="margin:4px 0 0;color:var(--muted);font-size:15px">Review reported chats and answer vendors faster with suggested replies.</p>
    </header>
    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
      <section class="card">
        <h2 style="margin:0 0 6px;font-size:18px">Reported chats</h2>
        <div id="reports"></div>
      </section>
      <section class="card">
        <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:18px">Vendor support</h2><span style="background:#E1F1E8;color:#145A3A;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px">Suggested reply</span></div>
        <div id="ask" style="background:#F6F8F7;border-radius:14px;padding:14px;margin:14px 0;font-size:15px;line-height:1.5">Loading...</div>
        <label for="reply" style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Suggested reply (review before sending)</label>
        <textarea id="reply" rows="6" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #D5DBD8;border-radius:12px;font-size:15px;font-family:inherit;line-height:1.5"></textarea>
        <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
          <button id="send" class="btn primary">Send reply</button>
          <button id="again" class="btn">Try another draft</button>
        </div>
      </section>
    </div>
  </main>
</div>
<script src="assets/nmd-wire.js"></script>
<script>
// Chats and support: reported chats and contact-form messages, live from the admin inbox.
(function () {
  var drafts = [
    'Hi, thanks for asking. You can move to another free booth from the Booth page until two weeks before the market. If the new booth costs less we refund the difference; if it costs more, you pay the difference.',
    'Hello. Booth changes are possible until two weeks before the market, from your application. Let us know the booth you want and we will check it for you.'
  ];
  var draft = 0, inquiries = [], support = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function load() {
    return nmd.api('/admin/inquiries?status=new').then(function (rows) {
      inquiries = rows;
      var reports = rows.filter(function (r) { return r.topic === 'Report a chat'; });
      document.getElementById('reports').innerHTML = reports.length ? reports.map(function (r) {
        return '<div style="padding:12px 0;border-top:1px solid #EEF1EF"><div style="font-weight:600">' + esc(r.name) + ' · ' + esc(r.email) + '</div><div style="font-size:14px;color:var(--muted);margin-top:4px;white-space:pre-wrap">' + esc(r.message) + '</div>' +
          '<button class="btn" style="margin-top:8px;padding:6px 12px" data-handle="' + r.id + '">Mark reviewed</button></div>';
      }).join('') : '<p style="color:var(--muted)">No reported chats right now.</p>';
      support = rows.filter(function (r) { return r.topic !== 'Report a chat'; })[0] || null;
      var ask = document.getElementById('ask');
      if (support) {
        ask.innerHTML = '<div style="font-size:13px;color:var(--muted);margin-bottom:4px">' + esc(support.name) + ' asks (' + esc(support.topic) + ')</div>' + esc(support.message);
        ask.style.whiteSpace = 'pre-wrap';
      } else {
        ask.textContent = 'No new support messages.';
      }
      document.getElementById('reply').value = support ? drafts[draft] : '';
    }).catch(function (err) { nmdToast(err.message, true); });
  }
  document.addEventListener('DOMContentLoaded', function () {
    load();
    document.getElementById('reports').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-handle]'); if (!b) return;
      nmd.api('/admin/inquiries/' + b.getAttribute('data-handle') + '/handle', { method: 'POST', body: {} })
        .then(function () { nmdToast('Marked reviewed'); return load(); }).catch(function (err) { nmdToast(err.message, true); });
    });
    document.getElementById('send').addEventListener('click', function () {
      var text = document.getElementById('reply').value.trim();
      if (!support) { nmdToast('There is no support message to answer.', true); return; }
      if (!text) { nmdToast('Write a reply first.', true); return; }
      nmd.api('/admin/inquiries/' + support.id + '/reply', { method: 'POST', body: { body: text } })
        .then(function () { nmdToast('Reply sent to ' + support.email); return load(); }).catch(function (err) { nmdToast(err.message, true); });
    });
    document.getElementById('again').addEventListener('click', function () {
      draft = (draft + 1) % drafts.length;
      document.getElementById('reply').value = support ? drafts[draft] : '';
    });
  });
})();
</script>
<script src="assets/site.js" defer></script>
</body>
</html>
