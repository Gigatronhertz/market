<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ads · Naija Market Day admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--accent:#0F6B4A;--ink:#111816;--muted:#5F6B66;--line:#E6EAE8}
*{box-sizing:border-box}
body{margin:0;background:#F6F8F7;color:var(--ink);font-family:Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:0 0 240px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:2px}
.side a{padding:10px 12px;font-size:15px;border-radius:10px}
.side a.on{background:#EEF4F0;color:var(--accent);font-weight:600}
.main{flex:999 1 600px;min-width:0;padding:32px;display:flex;flex-direction:column;gap:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.slot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #EEF1EF}
.bar{flex:1 1 220px;height:10px;background:#EEF1EF;border-radius:999px;position:relative}
.bar i{position:absolute;top:0;height:100%;background:var(--accent);border-radius:999px}
.chip{padding:3px 12px;font-size:13px;font-weight:600;border-radius:999px;white-space:nowrap}
.ok{background:#E1F1E8;color:#145A3A}.wait{background:#FBEBCB;color:#7A4A0A}.info{background:#E4ECF8;color:#1F4E79}.no{background:#FADDD8;color:#8A2A1C}
.btn{border-radius:999px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;background:var(--accent);color:#fff;border:1px solid var(--accent)}
</style>
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-nmd="admin-ads" data-gate="admin">
<div class="shell">
  <nav class="side" aria-label="Admin sections">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:24px;padding:0 8px"><span style="width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center">N</span>NMD</a>
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-approvals.html">Approvals</a>
    <a href="admin-maps.html">Booth map</a>
    <a href="admin-payments.html">Payments</a>
    <a href="admin-emails.html">Vendor emails</a>
    <a href="admin-ads.html" class="on">Ads</a>
    <a href="admin-content.html">News and events</a>
    <a href="admin-chats.html">Chats and support</a>
    <a href="admin-roles.html">Roles and permissions</a>
    <div style="margin-top:auto;padding-top:24px;border-top:1px solid var(--line)"><a href="logged-out.html" style="color:#8A2A1C">Log out</a></div>
  </nav>
  <main class="main">
    <header style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px">
      <div><h1 style="margin:0;font-size:30px;letter-spacing:-.02em">Ads</h1><p style="margin:4px 0 0;color:var(--muted);font-size:15px">Banner ads for the homepage and blog. Each city has a fixed number of slots, and banners show only on their dates.</p></div>
      <button class="btn" id="add" type="button">Add an ad</button>
    </header>

    <section class="card" id="form-box" hidden></section>
    <section class="card"><h2 style="margin:0 0 8px;font-size:18px">Banners</h2><div id="ads"><p style="color:var(--muted)">Loading banners...</p></div></section>
  </main>
</div>
<script src="assets/site.js" defer></script>
<script src="assets/nmd-wire.js"></script>
<script>
// Ads: live banners by location and city, with an add form and on/off switch.
(function () {
  var LOC = { home: 'Homepage', blog: 'Blog pages' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function status(b) {
    var today = new Date().toISOString().slice(0, 10);
    if (!b.active) return ['Off', 'wait'];
    if (b.ends_on < today) return ['Ended', 'info'];
    if (b.starts_on > today) return ['Scheduled', 'info'];
    return ['Running', 'ok'];
  }
  function load() {
    return nmd.api('/admin/banners').then(function (rows) {
      document.getElementById('ads').innerHTML = rows.length ? rows.map(function (b) {
        var st = status(b);
        return '<div class="slot" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid #EEF1EF">' +
          '<img src="' + esc(b.image_url) + '" alt="" style="width:120px;height:52px;object-fit:cover;border-radius:8px">' +
          '<div style="flex:1 1 200px;font-weight:600">' + esc(b.advertiser || 'Advertiser') + '<div style="font-weight:400;font-size:13px;color:var(--muted)">' + esc(LOC[b.location] || b.location) + ' · ' + esc(b.city) + ' · ' + esc(b.starts_on) + ' to ' + esc(b.ends_on) + '</div></div>' +
          '<span class="chip ' + st[1] + '">' + st[0] + '</span>' +
          '<button class="btn" style="padding:6px 12px" data-toggle="' + b.id + '" data-on="' + b.active + '" data-start="' + esc(b.starts_on) + '" data-end="' + esc(b.ends_on) + '" data-city="' + esc(b.city) + '" data-loc="' + esc(b.location) + '">' + (b.active ? 'Turn off' : 'Turn on') + '</button></div>';
      }).join('') : '<p style="color:var(--muted)">No banners yet. Add the first one.</p>';
    }).catch(function (err) { nmdToast(err.message, true); });
  }
  function openForm() {
    var box = document.getElementById('form-box');
    if (!box.hidden) { box.hidden = true; return; }
    var today = new Date().toISOString().slice(0, 10);
    box.hidden = false;
    box.innerHTML = '<h2 style="margin:0 0 12px;font-size:18px">New banner</h2>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">' +
      '<label class="field">Image<input type="file" id="f-img" accept="image/png,image/jpeg,image/webp,image/gif"></label>' +
      '<label class="field">Advertiser<input id="f-adv" type="text"></label>' +
      '<label class="field">Link<input id="f-link" type="url" placeholder="https://"></label>' +
      '<label class="field">City<input id="f-city" type="text" placeholder="Brampton"></label>' +
      '<label class="field">Where<select id="f-loc"><option value="home">Homepage</option><option value="blog">Blog pages</option></select></label>' +
      '<label class="field">Starts<input id="f-start" type="date" value="' + today + '"></label>' +
      '<label class="field">Ends<input id="f-end" type="date" value="' + today + '"></label></div>' +
      '<button class="btn" id="f-save" type="button">Save banner</button>';
    document.getElementById('f-save').addEventListener('click', function () {
      var f = document.getElementById('f-img').files[0];
      if (!f) { nmdToast('Upload a banner image.', true); return; }
      if (f.size > 5 * 1024 * 1024) { nmdToast('That image is over 5 MB.', true); return; }
      var r = new FileReader();
      r.onload = function () {
        nmd.api('/admin/banners', { method: 'POST', body: {
          image_url: r.result, advertiser: document.getElementById('f-adv').value, link: document.getElementById('f-link').value,
          city: document.getElementById('f-city').value, location: document.getElementById('f-loc').value,
          starts_on: document.getElementById('f-start').value, ends_on: document.getElementById('f-end').value, frequency_seconds: 6 } })
          .then(function () { box.hidden = true; nmdToast('Banner saved'); return load(); })
          .catch(function (err) { nmdToast(err.message, true); });
      };
      r.readAsDataURL(f);
    });
  }
  document.addEventListener('DOMContentLoaded', function () {
    load();
    document.getElementById('add').addEventListener('click', openForm);
    document.getElementById('ads').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-toggle]'); if (!b) return;
      var on = b.getAttribute('data-on') === 'true';
      nmd.api('/admin/banners/' + b.getAttribute('data-toggle'), { method: 'PUT', body: { active: !on, starts_on: b.getAttribute('data-start'), ends_on: b.getAttribute('data-end'), city: b.getAttribute('data-city'), location: b.getAttribute('data-loc') } })
        .then(function () { nmdToast(on ? 'Banner off' : 'Banner on'); return load(); }).catch(function (err) { nmdToast(err.message, true); });
    });
  });
})();
</script>

</body>
</html>
