<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor emails · Naija Market Day admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--accent:#0F6B4A;--ink:#111816;--muted:#5F6B66;--line:#E6EAE8}
*{box-sizing:border-box}
body{margin:0;background:#F6F8F7;color:var(--ink);font-family:Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:0 0 240px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:2px}
.side a{padding:10px 12px;font-size:15px;border-radius:10px}
.side a.on{background:#EEF4F0;color:var(--accent);font-weight:600}
.main{flex:999 1 600px;min-width:0;padding:32px;display:flex;flex-direction:column;gap:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #EEF1EF;cursor:pointer}
.row:first-child{border-top:0}
.row.sel{background:#F6FAF7;margin:0 -24px;padding:14px 24px}
.sw{width:44px;height:26px;border-radius:999px;border:0;padding:3px;display:flex;align-items:center;flex:none;cursor:pointer}
.knob{width:20px;height:20px;border-radius:50%;background:#fff;display:block}
.btn{border-radius:999px;padding:11px 22px;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit;border:1px solid #D5DBD8;background:#fff}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Admin sections">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:24px;padding:0 8px"><span style="width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center">N</span>NMD</a>
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-approvals.html">Approvals</a>
    <a href="admin-maps.html">Booth map</a>
    <a href="admin-payments.html">Payments</a>
    <a href="admin-emails.html" class="on">Vendor emails</a>
    <a href="admin-ads.html">Ads</a>
    <a href="admin-content.html">News and events</a>
    <a href="admin-chats.html">Chats and support</a>
    <a href="admin-roles.html">Roles and permissions</a>
    <div style="margin-top:auto;padding-top:24px;border-top:1px solid var(--line)"><a href="logged-out.html" style="color:#8A2A1C">Log out</a></div>
  </nav>
  <main class="main">
    <header><h1 style="margin:0;font-size:30px;letter-spacing:-.02em">Vendor emails</h1><p style="margin:4px 0 0;color:var(--muted);font-size:15px">Automatic emails vendors get at each step. Switch each one on or off.</p></header>
    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
      <section class="card" id="list" style="flex:1 1 420px"></section>
      <section class="card" style="flex:1 1 380px">
        <div style="font-size:13px;color:var(--muted)">Preview</div>
        <h2 id="pv-name" style="margin:4px 0 14px;font-size:20px"></h2>
        <div style="background:#F6F8F7;border-radius:14px;padding:20px;font-size:15px;line-height:1.6">
          <div style="font-size:13px;color:var(--muted);margin-bottom:8px" id="pv-subj"></div>
          Hi [Vendor name],<br><br><span id="pv-body"></span><br><br>The Naija Market Day team
        </div>
        <div style="display:flex;gap:10px;margin-top:16px"><button class="btn primary">Send test to me</button><button class="btn">Edit template</button></div>
      </section>
    </div>
  </main>
</div>
<script>
var EM = [
  ['Welcome and onboarding', 'When a vendor creates an account', 'Welcome to Naija Market Day. Next, upload your regulatory documents so we can approve your shop.', true],
  ['Documents received', 'After documents are uploaded', 'We have your documents and will review them within [review time].', true],
  ['Approved', 'When the team approves a vendor', 'Good news, you are approved. You can now list products and book a booth.', true],
  ['Sent back with notes', 'When something needs fixing', 'Thanks for applying. Please fix the points below and resubmit.', true],
  ['Booth payment receipt', 'After a successful Stripe payment', 'Thank you. Your booth is confirmed. Your QR check-in code is attached.', true],
  ['Payment reminder', '7 days before the deadline', 'A friendly reminder that your booth payment is due soon.', true],
  ['Market reminder', '3 days before the market', 'Your market is almost here. Here is your booth position and check-in time.', true],
  ['Ad ending soon', '2 days before an ad stops', 'Your ad is about to end. Renew to stay in rotation.', false]
];
var sel = 0;
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function render() {
  document.getElementById('list').innerHTML = EM.map(function (e, i) {
    return '<div class="row' + (i === sel ? ' sel' : '') + '" data-i="' + i + '">' +
      '<div style="flex:1"><b style="font-size:15px">' + esc(e[0]) + '</b><br><span style="font-size:13px;color:var(--muted)">' + esc(e[1]) + '</span></div>' +
      '<button class="sw" role="switch" aria-checked="' + e[3] + '" aria-label="Send automatically" data-t="' + i + '" style="justify-content:' + (e[3] ? 'flex-end' : 'flex-start') + ';background:' + (e[3] ? '#0F6B4A' : '#CBD3CF') + '"><span class="knob"></span></button></div>';
  }).join('');
  document.getElementById('pv-name').textContent = EM[sel][0];
  document.getElementById('pv-subj').textContent = 'Subject: ' + EM[sel][0] + ' · Naija Market Day';
  document.getElementById('pv-body').textContent = EM[sel][2];
}
document.getElementById('list').addEventListener('click', function (e) {
  var t = e.target.closest('[data-t]');
  if (t) { var i = Number(t.getAttribute('data-t')); EM[i][3] = !EM[i][3]; render(); return; }
  var r = e.target.closest('.row'); if (r) { sel = Number(r.getAttribute('data-i')); render(); }
});
render();
</script>
<script src="assets/site.js" defer></script>
</body>
</html>
